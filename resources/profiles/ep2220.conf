# Green jack line-out of the VIA VT1705 into the EP-2220 aux input.
# Owned keys only. No measured speaker EQ.
# liveprog_file is a script name. Apply copies it beside the other scripts
# and does not delete 3bandSplitting.eel or highpass70Hz.eel.
master_postgain=0
master_limthreshold=-1
crossfeed_enable=false
convolver_enable=false
compander_time_freq_transforms=0
bass_enable=false
stereowide_enable=false
ddc_enable=false
liveprog_enable=true
liveprog_file=ep2220Line.eel
