# VIA VT1705 line-out: green jack on the ASRock H61M-HVS, P2 cable to the
# EP-2220 aux input. Copy this file to
# ~/.config/pipewire/pipewire.conf.d/10-vt1705.conf
# and also copy meta/wireplumber/51-vt1705-line.conf, then restart
# PipeWire yourself. JamesDSP does not install these files and does not
# restart the audio server.
#
# 256 samples at 48 kHz is 5.3 ms. The max quantum of 1024 lets PipeWire
# raise the buffer if it crackles. Bluetooth, if used some other day, does
# not get faster because of this file.

context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 1024
}
