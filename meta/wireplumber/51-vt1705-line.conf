# VIA VT1705 line-out, the green jack on the ASRock H61M-HVS.
# The other end of the P2 cable is the EP-2220 aux input.
# Copy this file to ~/.config/wireplumber/wireplumber.conf.d/51-vt1705-line.conf
# and restart WirePlumber yourself. JamesDSP does not copy it and does not
# restart the audio server.
#
# node.latency 256/48000 is 5.3 ms. suspend-timeout 0 keeps the codec from
# sleeping when the cable goes quiet. Pair with meta/pipewire/10-vt1705.conf.
# Do not force api.alsa.period-size: this codec crackles if the period and
# the graph quantum fight.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1b.0.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        audio.rate = 48000
        node.latency = "256/48000"
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
